<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Every pod run across your repos, live." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preload" href="/fonts/geist-400.woff2" as="font" type="font/woff2" crossorigin />
    <title>Pod Board</title>
    <!-- Until the app CSS loads (in dev it comes with the module script), the browser's own canvas
         shows: follow the system, or the stored pick once the script below sets data-theme. -->
    <meta name="color-scheme" content="light dark" />
    <style>
      :root[data-theme="dark"] { color-scheme: dark; }
      :root[data-theme="light"] { color-scheme: light; }
    </style>
    <!-- Applies the theme before the first paint, so Dark never flashes light. A stored Light or
         Dark pick sets data-theme; System sets nothing, so the media query decides; nothing usable
         stored (or storage that throws) sets the default, Dark. Same key and rule as
         src/theme/theme.ts (THEME_KEY, readChoice); src/theme-boot.test.ts checks it. -->
    <script>
      var choice = null
      try {
        choice = window.localStorage.getItem('pod-board-theme')
      } catch (e) {}
      if (choice !== 'system') document.documentElement.setAttribute('data-theme', choice === 'light' ? 'light' : 'dark')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
