<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Every pod run across your repos, live." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f121a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preload" href="/fonts/instrument-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <title>Pod Board</title>
    <!-- Applies a stored Light or Dark pick before the first paint, so Dark never flashes light.
         Same key and values as src/theme/theme.ts (THEME_KEY); src/theme-boot.test.ts checks it. -->
    <script>
      try {
        var choice = window.localStorage.getItem('pod-board-theme')
        if (choice === 'light' || choice === 'dark') document.documentElement.setAttribute('data-theme', choice)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
